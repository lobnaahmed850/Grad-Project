worker_processes 2;
pid /run/nginx.pid;
error_log /dev/null;

events {
    worker_connections 1024;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 10s;
    keepalive_requests 100;
    default_type application/octet-stream;

    server {
        listen 8080;
        root /srv/files;
        index index.html;

        location /api/ {
            default_type application/json;
            return 200 '{"status":"ok","items":[1,2,3,4,5]}';
        }
    }
}
