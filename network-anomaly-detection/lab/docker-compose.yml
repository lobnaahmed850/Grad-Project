# An isolated test network: server-a, router r1, router r2, server-b.
# Every network is internal, so nothing here can reach the host's LAN or the internet.
name: netguard-lab

x-router: &router
  image: quay.io/frrouting/frr:10.2.1
  cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
  sysctls:
    net.ipv4.ip_forward: 1
  # Copy the config so the FRR startup script can't change file ownership in the repo.
  entrypoint: ["/bin/sh", "-c", "cp /config/* /etc/frr/ && chown frr:frr /etc/frr/* && exec /usr/lib/frr/docker-start"]

x-host: &host
  image: netguard-lab-host:1
  build:
    context: .
    dockerfile: host.Dockerfile
  cap_add: [NET_ADMIN]

services:
  r1:
    <<: *router
    hostname: r1
    volumes:
      - ./frr/r1:/config:ro
    networks:
      lan_a: {ipv4_address: 10.10.1.2}
      core: {ipv4_address: 10.10.2.2}

  r2:
    <<: *router
    hostname: r2
    volumes:
      - ./frr/r2:/config:ro
    networks:
      core: {ipv4_address: 10.10.2.3}
      lan_b: {ipv4_address: 10.10.3.2}

  r3:
    <<: *router
    hostname: r3
    volumes:
      - ./frr/r3:/config:ro
    networks:
      core: {ipv4_address: 10.10.2.4}
      lan_c: {ipv4_address: 10.10.4.2}

  server-a:
    <<: *host
    hostname: server-a
    environment:
      GATEWAY: 10.10.1.2
    networks:
      lan_a: {ipv4_address: 10.10.1.10}

  server-b:
    <<: *host
    hostname: server-b
    environment:
      GATEWAY: 10.10.3.2
    networks:
      lan_b: {ipv4_address: 10.10.3.10}

  # Debian host that runs standard security-testing tools (slowhttptest, nmap, wrk) against the
  # lab's own servers, to generate labelled attack traffic. Isolated like everything else here.
  attacker:
    build:
      context: .
      dockerfile: attacker.Dockerfile
    image: netguard-lab-attacker:1
    hostname: attacker
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      GATEWAY: 10.10.1.2
    networks:
      lan_a: {ipv4_address: 10.10.1.11}

  # Extra clients, so normal traffic comes from several sources across both subnets, not just
  # the two servers. They run the same host image; traffic is driven into them with compose exec.
  client-a1:
    <<: *host
    hostname: client-a1
    environment:
      GATEWAY: 10.10.1.2
    networks:
      lan_a: {ipv4_address: 10.10.1.20}

  client-a2:
    <<: *host
    hostname: client-a2
    environment:
      GATEWAY: 10.10.1.2
    networks:
      lan_a: {ipv4_address: 10.10.1.21}

  client-b1:
    <<: *host
    hostname: client-b1
    environment:
      GATEWAY: 10.10.3.2
    networks:
      lan_b: {ipv4_address: 10.10.3.20}

  server-c:
    <<: *host
    hostname: server-c
    environment:
      GATEWAY: 10.10.4.2
    networks:
      lan_c: {ipv4_address: 10.10.4.10}

  client-c1:
    <<: *host
    hostname: client-c1
    environment:
      GATEWAY: 10.10.4.2
    networks:
      lan_c: {ipv4_address: 10.10.4.20}

  # Shares r1's network interfaces, so it sees all traffic crossing the r1-r2 link.
  capture:
    image: netguard-lab-host:1
    network_mode: service:r1
    cap_add: [NET_ADMIN, NET_RAW]
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./captures:/captures
    depends_on: [r1]

  # Shares r2's network interfaces, for link settings the router image can't apply.
  r2-tools:
    image: netguard-lab-host:1
    network_mode: service:r2
    cap_add: [NET_ADMIN]
    entrypoint: ["sleep", "infinity"]
    depends_on: [r2]

networks:
  lan_a:
    internal: true
    ipam:
      config: [{subnet: 10.10.1.0/24}]
  core:
    internal: true
    ipam:
      config: [{subnet: 10.10.2.0/24}]
  lan_b:
    internal: true
    ipam:
      config: [{subnet: 10.10.3.0/24}]
  lan_c:
    internal: true
    ipam:
      config: [{subnet: 10.10.4.0/24}]
